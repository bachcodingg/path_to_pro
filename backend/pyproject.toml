[project]
name = "pathtopro-backend"
version = "0.1.0"
description = "PathToPro: agent system for academy player load, growth, recovery and development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "analytics"]
addopts = "--doctest-modules --ignore=.venv"

[tool.ruff]
line-length = 120
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analytics*", "agents*", "domain*", "simulator*", "eval*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP042", "B905"]
