[project]
name = "pathtopro-backend"
version = "0.1.0"
description = "PathToPro: agent system for academy player load, growth, recovery and development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "ortools>=9.10",
    "anthropic>=1.0",
    "pyjwt>=2.8",
    "cryptography>=42",
    "apscheduler>=3.10,<4",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "matplotlib>=3.8",
    "python-multipart>=0.0.9",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "analytics"]
addopts = "--doctest-modules --ignore=.venv"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analytics*", "agents*", "domain*", "simulator*", "eval*", "planner*", "api*", "gym*", "pathway*", "performance*", "devices*", "finance*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP042", "B905", "B008"]
