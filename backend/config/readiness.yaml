# Readiness score weights. These are team defaults, NOT values from a study.
# Clubs may change them; the sensitivity test (eval) checks robustness to +/-0.1 shifts.
weights:
  hrv: 0.40
  hooper: 0.35
  sleep: 0.25
bands:
  green_min: 70
  amber_min: 50
sleep_target_hours: 9.0
# Buffer before a colour changes (points past the band boundary). Safety-first:
# a worse colour applies at once (down: 0); a better colour needs the score to be
# clearly past the boundary (up: 8), so players don't flicker between colours.
hysteresis:
  up: 8
  down: 0
