# Render Blueprint: https://render.com -> New -> Blueprint -> this repository.
# One web service (API + website, Docker) and a PostgreSQL database, both in Frankfurt (EU).
# Free tier: the service sleeps after 15 min without traffic (first request ~1 min), and a
# free database expires after 30 days. Demo data is synthetic and loaded on first start.
databases:
  - name: pathtopro-db
    databaseName: pathtopro
    user: pathtopro
    plan: free
    region: frankfurt

services:
  - type: web
    name: pathtopro
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pathtopro-db
          property: connectionString
      - key: PATHTOPRO_JWT_SECRET
        generateValue: true
      - key: PATHTOPRO_FIELD_KEY
        generateValue: true
      - key: PATHTOPRO_AUTOSEED
        value: "on"
      # A demo deployment: demo accounts share a published password, so real players can't
      # sign up here. Run a separate deployment (AUTOSEED off, REGISTRATION on) for real use.
      - key: PATHTOPRO_REGISTRATION
        value: "off"
      - key: PATHTOPRO_SCHEDULER
        value: "off"
      - key: PATHTOPRO_LLM
        value: "auto"
      # Optional: an Anthropic API key turns on Claude for the agents (leave empty for rules only).
      - key: ANTHROPIC_API_KEY
        sync: false
      # A deployment for real players (AUTOSEED off, REGISTRATION on) also needs: the address
      # in emailed links, a mail server, and the club administrator. See docs/going-live.md.
      #   PATHTOPRO_PUBLIC_URL=https://your-domain
      #   PATHTOPRO_SMTP_HOST / _PORT / _USER / _PASSWORD, PATHTOPRO_MAIL_FROM
      #   PATHTOPRO_ADMIN_EMAIL, PATHTOPRO_ADMIN_PASSWORD (created once on start)
      #   PATHTOPRO_SCHEDULER=on (one instance) for the nightly agents, email retries and reminders
      #   PATHTOPRO_VAPID_PUBLIC_KEY / _PRIVATE_KEY (python -m api.jobs vapid) for phone notifications
