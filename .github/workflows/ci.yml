name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m eval --quick --out eval_results
        env:
          PATHTOPRO_LLM: "off"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e "./backend[dev]"
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright starts the API and web app)
        run: mkdir -p docs/screenshots && cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: frontend/test-results

  container:
    # The deployment image (root Dockerfile) on PostgreSQL, tested end to end.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pathtopro
          POSTGRES_USER: pathtopro
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pathtopro" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pathtopro .
      - name: Start container (production mode, demo data auto-seeded)
        run: |
          docker run -d --name app --network host             -e PORT=8080             -e DATABASE_URL=postgres://pathtopro:ci-only-password@127.0.0.1:5432/pathtopro             -e PATHTOPRO_JWT_SECRET=ci-only-jwt-secret-0123456789abcdef             -e PATHTOPRO_FIELD_KEY=ci-only-field-key             -e PATHTOPRO_AUTOSEED=on -e PATHTOPRO_SCHEDULER=off -e PATHTOPRO_LLM=off             pathtopro
          for i in $(seq 1 150); do
            curl -sf 127.0.0.1:8080/api/health | grep -q '"ready"' && break
            sleep 2
          done
          curl -sf 127.0.0.1:8080/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 127.0.0.1:8080/api/demo/seed)" = 403
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests against the container
        run: cd frontend && E2E_URL=http://127.0.0.1:8080/ npx playwright test -c playwright.prod.config.ts
      - if: failure()
        run: docker logs app

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep
        run: pipx run semgrep scan --config p/python --config p/typescript --config p/secrets --error --exclude frontend/node_modules
      - name: Trivy (dependencies and Dockerfiles)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          skip-dirs: frontend/node_modules
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
