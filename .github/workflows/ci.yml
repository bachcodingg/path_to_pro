name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: python -m eval --quick --out eval_results
        env:
          PATHTOPRO_LLM: "off"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e "./backend[dev]"
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Start API and web
        env:
          PATHTOPRO_LLM: "off"
          PATHTOPRO_SCHEDULER: "off"
        run: |
          (cd backend && uvicorn api.main:app --port 8000 &)
          (cd frontend && npx vite --port 5173 --strictPort &)
          for i in $(seq 1 60); do curl -sf 127.0.0.1:8000/api/health && curl -sf 127.0.0.1:5173 >/dev/null && break; sleep 1; done
      - run: mkdir -p docs/screenshots && cd frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: frontend/test-results

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Semgrep
        run: pipx run semgrep scan --config p/python --config p/typescript --config p/secrets --error --exclude frontend/node_modules
      - name: Trivy (dependencies and Dockerfiles)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
