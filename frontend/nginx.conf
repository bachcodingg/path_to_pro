server {
  listen 8080;
  root /usr/share/nginx/html;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
  }
  # Two apps: Pro League Data Tracking under /leagues/, PathToPro everywhere else
  location /leagues/ {
    try_files $uri /leagues/index.html;
  }
  location / {
    try_files $uri /index.html;
  }
}
